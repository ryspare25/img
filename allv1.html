<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <title>Repository File Randomizer</title>
      <meta http-equiv="Cache-Control" content="no-store"/>
      <script src="common/random-utils.js"></script>
   </head>
   <body>
      <script>
         (async () => {
         try{
         const [cfgRes,filesRes]=await Promise.all([
         fetch("all.json",{cache:"no-store"}),
         fetch("files.json",{cache:"no-store"})
         ]);
         if(!cfgRes.ok) throw new Error("Failed to load all.json");
         if(!filesRes.ok) throw new Error("Failed to load files.json");
         
         const cfg=await cfgRes.json();
         const files=await filesRes.json();
         
         const repos=cfg.repositories||{};
         const formulas=Array.isArray(cfg.formulas)?cfg.formulas:[];
         
         const IMAGE_EXT=/\.(png|jpe?g|gif|webp|bmp|avif|svg)$/i;
         const candidates=[];
         
         for(const filePath of files){
             if(typeof filePath!=="string") continue;
             if(filePath===".gitkeep"||filePath.endsWith("/.gitkeep")) continue;
         
             const parts=filePath.split("/");
             if(parts.length<2) continue;
         
             const repoName=parts[0];
             const fileName=parts[1];
             const repo=repos[repoName];
             if(!repo) continue;
         
             if(repo.images && !IMAGE_EXT.test(filePath)) continue;
         
             candidates.push({
                 url:`https://github.com/${repo.username}/img/blob/in7/files/${repoName}/${fileName}`,
                 path:filePath
             });
         }
         
         const n=candidates.length;
         if(!n) throw new Error("No candidate files found.");
         
         let formula="random";
         if(formulas.length){
             formula=formulas[Math.floor(getSecureRandomNumber()*formulas.length)];
         }
         
         const weights=new Array(n).fill(1);
         
         if(formula==="leftLeaning"){
             for(let i=0;i<n;i++) weights[i]=(n-i)*(0.5+getSecureRandomNumber());
         }else if(formula==="rightLeaning1"){
             for(let i=0;i<n;i++) weights[i]=(i+1)*(0.5+getSecureRandomNumber());
         }else if(formula==="recent20Percent"){
             for(let i=Math.floor(n*.8);i<n;i++) weights[i]=5;
         }else if(formula==="recent5Percent"){
             for(let i=Math.floor(n*.95);i<n;i++) weights[i]=20;
         }
         
         function cryptoRandom(){
          const b=new Uint32Array(1);
          crypto.getRandomValues(b);
          return b[0]/0xffffffff;
         }
         function cryptoNormal(mean=0,std=1){
          let u1=0,u2=0;
          while(!u1)u1=cryptoRandom();
          while(!u2)u2=cryptoRandom();
          return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2)*std+mean;
         }
         const key="repo_randomizer_memory_v2lksdflsjkflksjdlfskdjf";
         let mem=JSON.parse(localStorage.getItem(key)||"{}");
         let history=Array.isArray(mem.history)?mem.history:new Array(n).fill(0);
         if(history.length!==n){
          const h=new Array(n).fill(0);
          for(let i=0;i<Math.min(history.length,n);i++) h[i]=history[i];
          history=h;
         }
         let lastTs=mem.lastTs||Date.now();
         const now=Date.now();
         const days=Math.max(0,(now-lastTs)/(1000*60*60*24));
         if(days>0.1){
          const decay=Math.exp(-0.15*days);
          history=history.map(v=>v*decay);
         }
         const total=history.reduce((a,b)=>a+b,0);
         const bias=total?history.map(c=>((total/n)-c)/(total/n)*0.05):new Array(n).fill(0);
         const erratic=cryptoRandom()<0.08;
         const std=erratic?0.35:0.08;
         let adjusted=weights.map((w,i)=>Math.max(.0001,w+w*(cryptoNormal(0,std))+w*bias[i]));
         const sum=adjusted.reduce((a,b)=>a+b,0);
         adjusted=adjusted.map(v=>v/sum);
         const r=cryptoRandom();
         let cum=0,chosen=n-1;
         for(let i=0;i<n;i++){
          cum+=adjusted[i];
          if(r<cum){chosen=i;break;}
         }
         history[chosen]=(history[chosen]||0)+1;
         localStorage.setItem(key,JSON.stringify({history,lastTs:now}));
         
         location.href=candidates[chosen].url;
         
         }catch(e){
         document.body.innerHTML="<pre>"+e.message+"</pre>";
         }
         })();
      </script>
   </body>
</html>
